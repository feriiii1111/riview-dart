<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dart Review API — Tester</title>
<style>
  :root{
    --bg:#0f1113; --panel:#16191c; --panel-2:#1c2024; --line:#272b2f;
    --text:#e7e9ea; --muted:#8b9299; --accent:#0175c2; --accent-2:#13b9fd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 24px;
  }
  h1{ font-size:18px; margin:0 0 4px; }
  p.sub{ color:var(--muted); font-size:13px; margin:0 0 20px; }

  label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  input[type=text]{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-family:inherit; font-size:13px; margin-bottom:14px;
  }
  textarea{
    width:100%; min-height:220px; background:var(--panel); border:1px solid var(--line);
    color:var(--text); padding:12px; border-radius:8px; font-family:inherit; font-size:13px;
    line-height:1.5; resize:vertical; margin-bottom:14px;
  }
  button{
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff; border:0; padding:12px 20px; border-radius:8px; font-family:inherit;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  button:disabled{ opacity:0.5; cursor:progress; }

  .result{ margin-top:24px; }
  .status{ font-size:13px; margin-bottom:10px; }
  .status.ok{ color:#4ade80; }
  .status.err{ color:#f87171; }
  pre.errlog{
    background:#1c1216; border:1px solid #4a1f26; color:#ff8a8a;
    padding:12px; border-radius:8px; font-size:12px; white-space:pre-wrap; overflow:auto;
  }
  img.preview{
    max-width:100%; border:1px solid var(--line); border-radius:8px; display:block;
  }
</style>
</head>
<body>

<h1>Dart Review API — Tester</h1>
<p class="sub">Halaman ini cuma buat nyoba manggil API-mu langsung dari browser (fetch POST).</p>

<label for="apiUrl">URL API (endpoint /api/review)</label>
<input type="text" id="apiUrl" placeholder="https://url-api-kamu.up.railway.app/api/review">

<label for="code">Kode Dart</label>
<textarea id="code" spellcheck="false">void main() {
  print('Halo dari tester!');
}</textarea>

<button id="submitBtn">▶ Kirim ke API</button>

<div class="result" id="result"></div>

<script>
  const apiUrlInput = document.getElementById('apiUrl');
  const codeInput = document.getElementById('code');
  const submitBtn = document.getElementById('submitBtn');
  const result = document.getElementById('result');

  submitBtn.addEventListener('click', async () => {
    const apiUrl = apiUrlInput.value.trim();
    const code = codeInput.value;

    if (!apiUrl) {
      result.innerHTML = '<div class="status err">Isi dulu URL API-nya.</div>';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Memproses... (bisa 10-15 detik)';
    result.innerHTML = '<div class="status">Menunggu server compile & screenshot...</div>';

    try {
      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });
      const data = await res.json();

      let html = '';
      if (data.success) {
        html += '<div class="status ok">✅ Berhasil, tidak ada error compile.</div>';
      } else {
        html += '<div class="status err">⚠️ Ada error compile (gambar tetap ditampilkan kalau ada).</div>';
        if (data.error) {
          html += `<pre class="errlog">${data.error.replace(/</g, '&lt;')}</pre>`;
        }
      }
      if (data.image_base64) {
        html += `<img class="preview" src="data:${data.mime_type || 'image/png'};base64,${data.image_base64}" alt="Hasil preview">`;
      }
      result.innerHTML = html;
    } catch (e) {
      result.innerHTML = `<div class="status err">Gagal memanggil API: ${e.message}</div>`;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '▶ Kirim ke API';
    }
  });
</script>

</body>
</html>
