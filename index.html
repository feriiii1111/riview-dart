<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dart Snippet Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
  :root{
    --bg: #0f1113;
    --panel: #16191c;
    --panel-2: #1c2024;
    --line: #272b2f;
    --text: #e7e9ea;
    --muted: #8b9299;
    --accent: #0175c2; /* dart blue */
    --accent-2: #13b9fd; /* dart cyan */
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display:flex;
    flex-direction:column;
  }

  header{
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display:inline-block;
    flex-shrink:0;
  }
  h1{
    font-size: 18px;
    font-weight: 600;
    margin:0;
    letter-spacing: 0.2px;
  }
  header p{
    margin: 8px 0 0 20px;
    color: var(--muted);
    font-size: 13px;
    max-width: 60ch;
  }

  main{
    flex:1;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    min-height: 0;
  }
  @media (max-width: 860px){
    main{ grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  }

  .pane{
    background: var(--panel);
    display:flex;
    flex-direction:column;
    min-height: 0;
  }
  .pane-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .pane-head span.label{
    color: var(--text);
    font-weight: 600;
  }

  textarea{
    flex:1;
    resize:none;
    border:0;
    outline:0;
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.55;
    padding: 16px;
    tab-size: 2;
  }
  textarea::placeholder{ color: #565c62; }

  .code-scroll{
    flex:1;
    overflow: auto;
    background: #0d1013;
  }
  pre{
    margin:0;
    padding: 16px;
    min-height: 100%;
  }
  pre code.hljs{
    background: transparent !important;
    font-size: 13.5px;
    line-height: 1.55;
    padding: 0 !important;
  }

  button.copy-btn{
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 11.5px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  button.copy-btn:hover{ border-color: var(--accent-2); color: var(--accent-2); }
  button.copy-btn:active{ transform: translateY(1px); }

  ::selection{ background: rgba(19,185,253,0.25); }

  footer{
    padding: 10px 32px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--muted);
    display:flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>Dart Snippet Viewer</h1>
  </div>
  <p>Tempel kode Dart di sisi kiri, hasil dengan syntax highlighting langsung muncul di sisi kanan.</p>
</header>

<main>
  <section class="pane">
    <div class="pane-head">
      <span class="label">Editor</span>
      <span id="lineCount">0 baris</span>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="void main() {
  print('Halo, Dart!');
}"></textarea>
  </section>

  <section class="pane">
    <div class="pane-head">
      <span class="label">Preview</span>
      <button class="copy-btn" id="copyBtn">Salin kode</button>
    </div>
    <div class="code-scroll">
      <pre><code id="output" class="language-dart"></code></pre>
    </div>
  </section>
</main>

<footer>
  <span>Highlighting oleh highlight.js</span>
  <span id="charCount">0 karakter</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dart.min.js"></script>
<script>
  const editor = document.getElementById('editor');
  const output = document.getElementById('output');
  const lineCount = document.getElementById('lineCount');
  const charCount = document.getElementById('charCount');
  const copyBtn = document.getElementById('copyBtn');

  const sample = `import 'dart:math';

class Circle {
  final double radius;
  Circle(this.radius);

  double get area => pi * radius * radius;
}

void main() {
  final circle = Circle(4.5);
  print('Luas lingkaran: \${circle.area.toStringAsFixed(2)}');

  final angka = [1, 2, 3, 4, 5];
  final genap = angka.where((n) => n % 2 == 0).toList();
  print('Angka genap: \$genap');
}`;

  function render() {
    const code = editor.value;
    output.textContent = code;
    delete output.dataset.highlighted;
    hljs.highlightElement(output);

    const lines = code === '' ? 0 : code.split('\n').length;
    lineCount.textContent = `${lines} baris`;
    charCount.textContent = `${code.length} karakter`;
  }

  editor.addEventListener('input', render);

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(editor.value);
      copyBtn.textContent = 'Tersalin!';
      setTimeout(() => (copyBtn.textContent = 'Salin kode'), 1500);
    } catch (e) {
      copyBtn.textContent = 'Gagal menyalin';
      setTimeout(() => (copyBtn.textContent = 'Salin kode'), 1500);
    }
  });

  editor.value = sample;
  render();
</script>

</body>
</html>
